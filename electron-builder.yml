appId: app.canalstudio
productName: Canal Studio
directories:
  buildResources: build
  output: dist
# No asar: the Remotion bundler (webpack + esbuild), its compositor binaries and the
# headless Chrome download all need real files on disk.
asar: false
files:
  - out/**
  - package.json
  - remotion/**/*.{ts,tsx}
  - shared/render.ts
  - python/server.py
  - python/warmup.py
  - python/requirements.txt
  - scripts/check-setup.ps1
  - resources/**
  - '!**/.vscode/*'
  - '!**/*.map'
win:
  executableName: canal-studio
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
